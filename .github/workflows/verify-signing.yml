# Temporary: proves the KEYSTORE_* secrets hold the rotated key by printing
# the release signing certificate digest (public in any signed APK). Runs
# only on this branch; delete the branch afterwards.
name: Verify release signing

on:
  push:
    branches:
      - chore/verify-release-signing

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write keystore.properties from secrets
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/focuslock.jks
          echo "storeFile=focuslock.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Print signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -q 375eedd0989c48a351c72531265ce94af200936a261cb182d1100bb8ff5a7e07
